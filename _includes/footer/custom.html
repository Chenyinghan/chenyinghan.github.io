{% if content contains 'language-mermaid' %}
<!-- Load Mermaid only on pages containing Mermaid code blocks. -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
    const diagrams = Array.from(document.querySelectorAll('code.language-mermaid'),
      node => ({ node, source: node.textContent }));
    const renderDiagrams = async () => {
      mermaid.initialize({startOnLoad:false, theme:systemTheme.matches ? 'dark' : 'default'});
      for (const { node, source } of diagrams) {
        node.removeAttribute('data-processed');
        node.textContent = source;
      }
      await mermaid.run({nodes:diagrams.map(({ node }) => node)});
    };
    if (diagrams.length > 0) {
      let rendering = Promise.resolve();
      const updateDiagrams = () => {
        rendering = rendering.then(renderDiagrams).catch(console.error);
      };
      updateDiagrams();
      systemTheme.addEventListener('change', updateDiagrams);
    }
</script>
{% endif %}
